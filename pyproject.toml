[project]
name = "lost-tokens"
version = "0.2.0"
description = "Reusing unchosen reasoning branches as in-context memory"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.6.0",
    "transformers==4.57.1",
    "huggingface-hub>=0.34,<1",
    "math-verify>=0.8,<1",
    "pyarrow>=19,<24",
    "filelock>=3.13",
]

[project.scripts]
lost-tokens = "lost_tokens.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lost_tokens"]

[tool.uv]
required-version = ">=0.8"

[dependency-groups]
dev = ["ruff==0.13.2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F821"]
