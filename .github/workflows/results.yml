name: Shared result validation
on:
  push:
    branches: [shared-evaluation]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/results.py validate
      - run: python tools/results.py index --check
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
